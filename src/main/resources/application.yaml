spring:
  application:
    name: ai-portfolio-analyser
  threads:
    virtual:
      enabled: true
  ai:
    openai:
      chat:
        base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
        options:
          model: ${AI_MODEL:gemini-3-flash-preview}
      api-key: ${OPEN_AI_API_KEY}
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 3
      idle-timeout: 300000
      connection-timeout: 10000
      max-lifetime: 600000
    url: ${POSTGRES_CLOUD_URL}
    username: ${POSTGRES_CLOUD_USER}
    password: ${POSTGRES_CLOUD_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jooq:
    sql-dialect: POSTGRES
  springdoc:
    swagger-ui:
      enabled: true
      path: /swagger-ui.html

server:
  forward-headers-strategy: framework